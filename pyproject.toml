[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mexerica"
version = "0.2.0"
description = "Conversor de arquivos offline para o desktop Linux: arraste, segure uma tecla, solte na roda."
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Nicolas Queiroz" }]
dependencies = [
    "imageio-ffmpeg",
    "pypandoc_binary",
    "pymupdf",
    "pymupdf4llm",
    "pdf2docx",
    "pillow",
    "pillow-heif",
    "python-pptx",
    "python-docx",
    "openpyxl",
    "segno",
]

[project.urls]
Homepage = "https://github.com/Nicolas-Queiroz/Mexerica"
Issues = "https://github.com/Nicolas-Queiroz/Mexerica/issues"

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
mexerica = "mexerica.__main__:main"

[tool.setuptools.packages.find]
include = ["mexerica*"]

[tool.setuptools.package-data]
mexerica = ["data/*.css", "data/icons/hicolor/*/apps/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.black]
line-length = 100
